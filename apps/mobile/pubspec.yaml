name: ludo_lovers
description: Ludo Lovers — Android-first local Ludo game.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.4.0
  shared_preferences: ^2.5.3
  flame: ^1.33.0
  audioplayers: ^6.5.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/board/ludo_board_glass.webp
    - assets/images/board/extracted/
    - assets/images/branding/ludo_lovers_icon.webp
    - assets/images/splash/splash_background.webp

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-700.ttf
          weight: 700
