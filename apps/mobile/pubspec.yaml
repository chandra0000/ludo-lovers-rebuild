name: ludo_lovers
description: Ludo Lovers — Android-first local Ludo game.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  flame: ^1.33.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/board/ludo_board_glass.webp
    - assets/images/branding/ludo_lovers_icon.webp
    - assets/images/splash/splash_background.webp
