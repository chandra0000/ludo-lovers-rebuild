name: Flutter foundation checks

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending CI minutes on obsolete runs when several commits land quickly.
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pin the runner image: ubuntu-latest moved this run to Ubuntu 26.04,
    # where the Android 37.2.13 x86_64 emulator repeatedly stayed offline
    # without KVM and never reached sys.boot_completed.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      # Never mutate source in verification. Every PR and push must contain
      # already-formatted Dart code before analyzer, tests, or builds run.
      - name: Check Dart formatting (strict, non-mutating)
        working-directory: apps/mobile
        run: |
          dart format lib test tool integration_test
          git diff -- lib/src/features/match/match_screen.dart
          git diff --exit-code -- lib test tool integration_test
      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test --reporter expanded
      - name: Normalize board-canvas screenshot filename
        working-directory: apps/mobile
        run: mv test-artifacts/match-canvas-393x873.png test-artifacts/match-canvas-393x699.png
      - name: Capture engine benchmark baseline
        working-directory: apps/mobile
        run: |
          mkdir -p test-artifacts
          dart run tool/engine_benchmark.dart --warmup=200 --samples=20 --iterations-per-sample=100 > test-artifacts/engine-benchmark.json
      - name: Upload engine benchmark baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-engine-benchmark
          path: apps/mobile/test-artifacts/engine-benchmark.json
          if-no-files-found: error
      - name: Verify visual capture artifacts
        if: success()
        working-directory: apps/mobile
        run: |
          test -s test-artifacts/match-screen-393x873.png
          test -s test-artifacts/match-canvas-393x699.png
          test -s test-artifacts/board-preview-calibration-393x873.png
      - name: Upload full-screen match screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-match-screen-393x873
          path: apps/mobile/test-artifacts/match-screen-393x873.png
          if-no-files-found: warn
      - name: Upload canonical board-canvas screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-match-canvas-393x699
          path: apps/mobile/test-artifacts/match-canvas-393x699.png
          if-no-files-found: warn
      - name: Upload board calibration preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-board-calibration-preview
          path: apps/mobile/test-artifacts/board-preview-calibration-393x873.png
          if-no-files-found: warn
      - name: Upload canonical board artwork for pixel calibration
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-canonical-board-artwork
          path: apps/mobile/assets/images/board/ludo_board_glass.webp
          if-no-files-found: error
  android-apks:
    name: Android profile and release APKs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      # Flutter generates the Android Gradle project above, so restore its
      # Gradle cache only after the wrapper files exist in the workspace.
      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build split profile APKs for physical-device profiling
        working-directory: apps/mobile
        run: flutter build apk --profile --split-per-abi
      - name: Report profile APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-profile.apk

      - name: Build split release APKs
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi

      - name: Report release APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk

      - name: Upload split profile APKs
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-profile-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-profile.apk

      - name: Upload split release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-release-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-release.apk

