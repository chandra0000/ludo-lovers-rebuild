name: Flutter foundation checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending CI minutes on obsolete runs when several commits land quickly.
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check formatting across the Flutter application
        run: |
          dart format --output=none --set-exit-if-changed apps/mobile/lib apps/mobile/test
      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test --reporter expanded
      - name: Verify visual capture artifacts
        if: success()
        working-directory: apps/mobile
        run: |
          test -s test-artifacts/match-canvas-393x873.png
          test -s test-artifacts/board-preview-calibration-393x873.png
      - name: Upload deterministic match screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-match-canvas-393x873
          path: apps/mobile/test-artifacts/match-canvas-393x873.png
          if-no-files-found: warn
      - name: Upload board calibration preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-board-calibration-preview
          path: apps/mobile/test-artifacts/board-preview-calibration-393x873.png
          if-no-files-found: warn
      - name: Upload canonical board artwork for pixel calibration
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-canonical-board-artwork
          path: apps/mobile/assets/images/board/ludo_board_glass.webp
          if-no-files-found: error
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      # Flutter generates the Android Gradle project above, so restore its
      # Gradle cache only after the wrapper files exist in the workspace.
      - name: Cache Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build split profile APKs for physical-device profiling
        working-directory: apps/mobile
        run: flutter build apk --profile --split-per-abi
      - name: Report profile APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-profile.apk

      - name: Build split release APKs
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi

      - name: Report release APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk

      - name: Upload split profile APKs
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-profile-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-profile.apk

      - name: Upload split release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-release-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-release.apk
