name: Flutter foundation checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Format Dart sources and show proposed changes
        working-directory: apps/mobile
        run: |
          dart format lib test
          git diff -- lib test
      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test --update-goldens --reporter expanded
      - name: Upload deterministic match screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-match-canvas-393x873
          path: apps/mobile/test-artifacts/match-canvas-393x873.png
          if-no-files-found: error
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      - name: Android emulator integration smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd apps/mobile && flutter test integration_test/app_smoke_test.dart -d emulator-5554

      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Report debug APK size
        working-directory: apps/mobile
        run: du -h build/app/outputs/flutter-apk/app-debug.apk

      - name: Build split release APKs
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi

      - name: Report release APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-foundation-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload split release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-release-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-release.apk
