name: Flutter foundation checks

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize each PR/ref without cancelling active verification/build jobs.
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Pin the runner image: ubuntu-latest moved this run to Ubuntu 26.04,
    # where the Android 37.2.13 x86_64 emulator repeatedly stayed offline
    # without KVM and never reached sys.boot_completed.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      # Never mutate source in verification. Every PR and push must contain
      # already-formatted Dart code before analyzer, tests, or builds run.
      - name: Check Dart formatting (strict, non-mutating)
        id: dart_format
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver
      - name: Show required formatting changes
        if: failure() && steps.dart_format.outcome == 'failure'
        working-directory: apps/mobile
        run: dart format lib test tool integration_test test_driver && git diff --
      - name: Static analysis
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos
      - name: Unit and widget tests
        working-directory: apps/mobile
        run: flutter test --reporter expanded
      - name: Verify all responsive PNG artifacts
        working-directory: apps/mobile
        run: python3 tool/verify_responsive_screenshots.py --premium-flows
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-linux-responsive-screenshots
          path: apps/mobile/test-artifacts/acceptance/*.png
          if-no-files-found: error
      - name: Normalize board-canvas screenshot filename
        working-directory: apps/mobile
        run: mv test-artifacts/match-canvas-393x873.png test-artifacts/match-canvas-393x699.png
      - name: Capture engine benchmark baseline
        working-directory: apps/mobile
        run: |
          mkdir -p test-artifacts
          dart run tool/engine_benchmark.dart --warmup=200 --samples=20 --iterations-per-sample=100 > test-artifacts/engine-benchmark.json
      - name: Upload engine benchmark baseline
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-engine-benchmark
          path: apps/mobile/test-artifacts/engine-benchmark.json
          if-no-files-found: error
      - name: Verify visual capture artifacts
        if: success()
        working-directory: apps/mobile
        run: |
          test -s test-artifacts/match-screen-393x873.png
          test -s test-artifacts/match-canvas-393x699.png
          test -s test-artifacts/board-preview-calibration-393x873.png
      - name: Upload full-screen match screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-match-screen-393x873
          path: apps/mobile/test-artifacts/match-screen-393x873.png
          if-no-files-found: warn
      - name: Upload canonical board-canvas screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-match-canvas-393x699
          path: apps/mobile/test-artifacts/match-canvas-393x699.png
          if-no-files-found: warn
      - name: Upload board calibration preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-board-calibration-preview
          path: apps/mobile/test-artifacts/board-preview-calibration-393x873.png
          if-no-files-found: warn
      - name: Upload canonical board artwork for pixel calibration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-canonical-board-artwork
          path: apps/mobile/assets/images/board/ludo_board_glass.webp
          if-no-files-found: error
  android-apks:
    name: Android profile and release APKs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
          fi
      - name: Restore approved native branding after scaffolding
        working-directory: apps/mobile
        run: python3 tool/generate_branding.py --apply
      # Flutter generates the Android Gradle project above, so restore its
      # Gradle cache only after the wrapper files exist in the workspace.
      - name: Cache Android Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build split profile APKs for physical-device profiling
        working-directory: apps/mobile
        run: flutter build apk --profile --split-per-abi --dart-define=LUDO_ENABLE_UNRELEASED_MODES=true
      - name: Report profile APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-profile.apk

      - name: Build split release APKs
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi

      - name: Report release APK sizes
        working-directory: apps/mobile
        run: ls -lh build/app/outputs/flutter-apk/*-release.apk

      # The generated runner uses a debug signing certificate. This verifies
      # bundle compilation only; it is deliberately not a store-ready artifact.
      - name: Build validation-only release app bundle
        working-directory: apps/mobile
        run: flutter build appbundle --release
      - name: Verify validation bundle exists
        working-directory: apps/mobile
        run: test -s build/app/outputs/bundle/release/app-release.aab
      - name: Upload validation-only app bundle (not production signed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-validation-only-app-bundle-not-production-signed
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload internal-mode profile APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-internal-modes-profile-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-profile.apk

      - name: Upload split release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-release-apks
          path: apps/mobile/build/app/outputs/flutter-apk/*-release.apk

