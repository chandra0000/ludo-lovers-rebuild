name: Dependency security

on:
  pull_request:
    paths:
      - apps/mobile/pubspec.yaml
      - apps/mobile/pubspec.lock
      - .github/scripts/audit_pub_dependencies.py
      - .github/scripts/test_audit_pub_dependencies.py
      - .github/workflows/**
      - .github/scripts/verify_workflow_security.py
      - .github/scripts/test_verify_workflow_security.py
  push:
    branches: [main]
    paths:
      - apps/mobile/pubspec.lock
      - .github/workflows/**
      - .github/scripts/audit_pub_dependencies.py
      - .github/scripts/verify_workflow_security.py
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pub-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test fail-closed advisory handling
        run: |
          python3 .github/scripts/test_audit_pub_dependencies.py
          python3 .github/scripts/test_verify_workflow_security.py
      - name: Reject mutable workflow dependencies
        run: python3 .github/scripts/verify_workflow_security.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve committed dependency versions
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart pub deps --json > ../../dependency-graph.json
      - name: Query OSV advisories for the resolved graph
        run: python3 .github/scripts/audit_pub_dependencies.py dependency-graph.json --output security-artifacts/pub-advisories.json
      - name: Preserve advisory report even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pub-security-report
          path: security-artifacts/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Download uploaded advisory report using existing v4 reader
        if: success()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pub-security-report
          path: artifact-roundtrip
      - name: Require byte-identical artifact round trip
        if: success()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          assert Path('security-artifacts/pub-advisories.json').read_bytes() == Path('artifact-roundtrip/pub-advisories.json').read_bytes()
          PYCODE
