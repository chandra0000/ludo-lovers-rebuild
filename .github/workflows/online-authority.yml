name: Online authority
on:
  pull_request:
    paths:
      - 'services/online/**'
      - 'supabase/**'
      - 'apps/mobile/lib/src/game/**'
      - '.github/workflows/online-authority.yml'
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.2
      - run: dart analyze --fatal-infos services/online
      - run: dart compile exe services/online/bin/server.dart -o /tmp/ludo-authority
