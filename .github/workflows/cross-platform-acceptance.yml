name: Cross-platform acceptance (Android and iOS)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/cross-platform-acceptance.yml"
      - ".github/scripts/ios_simulator_integration.sh"
      - ".github/scripts/ios_simulator_integration.py"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/cross-platform-acceptance.yml"
      - ".github/scripts/ios_simulator_integration.sh"
      - ".github/scripts/ios_simulator_integration.py"
  workflow_dispatch:

concurrency:
  group: cross-platform-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate missing Android runner in CI
        working-directory: apps/mobile
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
          fi
      - name: Restore approved native branding after scaffolding
        working-directory: apps/mobile
        run: python3 tool/generate_branding.py --apply
      - name: Reuse pinned Android dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Upload Android acceptance APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludo-android-acceptance-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Xcode and simulator environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Generate missing iOS runner in CI
        working-directory: apps/mobile
        run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios --project-name ludo_lovers --org com.ludolovers .
          fi
      - name: Restore approved native branding after scaffolding
        working-directory: apps/mobile
        run: python3 tool/generate_branding.py --apply
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Run responsive and event presentation widget tests on macOS
        timeout-minutes: 12
        working-directory: apps/mobile
        run: flutter test test/integrated_match_presentation_test.dart test/match_profiles_layer_test.dart test/match_move_presentation_plan_test.dart test/modes/team_up_responsive_capture_test.dart test/modes/premium_flow_capture_test.dart test/royal_mode_capture_test.dart
      - name: Verify all responsive PNG artifacts
        working-directory: apps/mobile
        run: python3 tool/verify_responsive_screenshots.py --premium-flows
      - name: Upload macOS-rendered widget screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludo-macos-responsive-widget-screenshots
          path: apps/mobile/test-artifacts/acceptance/*.png
          if-no-files-found: error
      - name: Build iOS simulator app with Xcode
        working-directory: apps/mobile
        run: flutter build ios --simulator --debug --no-codesign
      - name: Verify simulator app artifact
        working-directory: apps/mobile
        run: test -d build/ios/iphonesimulator/Runner.app
      - name: Upload unsigned iOS simulator build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludo-ios-simulator-app
          path: apps/mobile/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
      - name: Run installed iPhone simulator navigation and local modes
        timeout-minutes: 15
        working-directory: apps/mobile
        run: bash ../../.github/scripts/ios_simulator_integration.sh
      - name: Upload installed iPhone simulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludo-installed-ios-simulator-screenshots
          path: apps/mobile/test-artifacts/native/*.png
          if-no-files-found: error
      - name: Simulator diagnostics on failure
        if: failure()
        timeout-minutes: 2
        run: |
          mkdir -p simulator-diagnostics
          xcrun simctl list devices > simulator-diagnostics/devices.txt
          xcrun simctl spawn booted log show --last 2m --style compact --predicate 'process == "Runner"' > simulator-diagnostics/runner.txt 2>&1 || true
      - name: Upload simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ludo-ios-simulator-diagnostics
          path: simulator-diagnostics/
          if-no-files-found: warn
