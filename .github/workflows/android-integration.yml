name: Android integration (checkpoint)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-integration.yml"
      - ".github/scripts/android_integration.sh"
      - ".github/scripts/summarize_emulator_crash.py"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: android-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-integration:
    # PRs are opt-in via label; main and manual dispatch always run.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-android-integration' || github.event.label.name == 'compare-emulator-gpu'
    strategy:
      fail-fast: false
      matrix:
        gpu: ${{ fromJSON(github.event.label.name == 'compare-emulator-gpu' && '["swiftshader","swangle"]' || '["swangle"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      - name: Restore approved native branding after scaffolding
        working-directory: apps/mobile
        run: python3 tool/generate_branding.py --apply
      - name: Cache pinned Android Gradle dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Bound build memory and compile before booting emulator
        timeout-minutes: 10
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle.properties')
          lines = [line for line in path.read_text().splitlines()
                   if not line.startswith(('org.gradle.jvmargs=', 'org.gradle.daemon=',
                                           'org.gradle.workers.max=', 'kotlin.compiler.execution.strategy='))]
          lines.extend(['org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError',
                        'org.gradle.daemon=false', 'org.gradle.workers.max=2',
                        'kotlin.compiler.execution.strategy=in-process'])
          path.write_text('\n'.join(lines) + '\n')
          PY
          free -m
          flutter build apk --debug --no-pub --target-platform=android-x64 --target=integration_test/app_navigation_test.dart --dart-define=LUDO_ENABLE_UNRELEASED_MODES=true
          test -s build/app/outputs/flutter-apk/app-debug.apk
          (cd android && ./gradlew --stop)
          free -m
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Record exact source and emulator implementation
        run: |
          mkdir -p emulator-diagnostics
          git rev-parse HEAD > emulator-diagnostics/source.txt
          flutter --version > emulator-diagnostics/flutter.txt
          sha256sum apps/mobile/build/app/outputs/flutter-apk/app-debug.apk > emulator-diagnostics/apk-sha256.txt
          echo '${{ matrix.gpu }}' > emulator-diagnostics/emulator-gpu-mode.txt
      - name: Android emulator integration smoke test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 420
          emulator-options: -no-snapshot -no-window -gpu ${{ matrix.gpu }} -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          # Compare supported direct SwiftShader and ANGLE-over-SwiftShader.
          # Flutter retains its default GPU renderer in both comparison cases;
          # this chooses the emulator GLES backend, not Flutter software mode.
          disable-animations: true
          working-directory: apps/mobile
          script: bash ../../.github/scripts/android_integration.sh
      - name: Upload installed Android emulator screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-installed-android-emulator-screenshots-${{ matrix.gpu }}
          path: apps/mobile/test-artifacts/native/*.png
          if-no-files-found: error
      - name: Collect emulator diagnostics on failure
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          mkdir -p emulator-diagnostics
          free -m > emulator-diagnostics/host-memory.txt
          ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,40p' > emulator-diagnostics/host-processes.txt
          sudo dmesg -T | tail -200 > emulator-diagnostics/host-kernel.txt 2>&1 || true
          sudo python3 .github/scripts/summarize_emulator_crash.py > emulator-diagnostics/qemu-native-summary.txt
          if [ -d /tmp/android-runner ]; then
            find /tmp/android-runner -type f -name '*crash*' -printf '%f %s bytes\n' > emulator-diagnostics/native-crash-files.txt
          fi
          sudo chown -R "$(id -u):$(id -g)" emulator-diagnostics
          timeout 15s adb devices -l > emulator-diagnostics/devices.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 shell getprop > emulator-diagnostics/properties.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 logcat -d -t 3000 > emulator-diagnostics/logcat.txt 2>&1 || true
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-emulator-diagnostics-${{ matrix.gpu }}
          path: emulator-diagnostics/
          if-no-files-found: warn
