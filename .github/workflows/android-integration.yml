name: Android integration (checkpoint)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      comparison-case:
        required: true
        type: string
      software-rendering:
        required: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-integration.yml"
      - ".github/scripts/android_integration.sh"
      - ".github/scripts/summarize_emulator_crash.py"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: android-checkpoint-${{ github.ref }}-${{ inputs.comparison-case || 'standard' }}
  cancel-in-progress: false

jobs:
  android-integration:
    # PRs are opt-in via label; main and manual dispatch always run.
    if: inputs.comparison-case != '' || github.event_name != 'pull_request' || github.event.label.name == 'run-android-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LUDO_COMPARISON_CASE: ${{ inputs.comparison-case }}
      LUDO_SOFTWARE_RENDERING: ${{ inputs.software-rendering == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Check out common comparison harness
        if: inputs.comparison-case != ''
        uses: actions/checkout@v4
        with:
          ref: e6a6fa785a243c0b410e43228445ec6bfb12af5f
          path: comparison-harness
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/android_native_qa.py
            /apps/mobile/integration_test/app_navigation_test.dart
            /apps/mobile/integration_test/support/gameplay_recording.dart
      - name: Use the same installed test and host driver in every comparison
        if: inputs.comparison-case != ''
        run: |
          for path in .github/scripts/android_native_qa.py \
            apps/mobile/integration_test/app_navigation_test.dart \
            apps/mobile/integration_test/support/gameplay_recording.dart; do
            cp "comparison-harness/$path" "$path"
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      - name: Restore approved native branding after scaffolding
        working-directory: apps/mobile
        run: |
          if [ -f tool/generate_branding.py ]; then
            python3 tool/generate_branding.py --apply
          else
            test "$(git rev-parse HEAD)" = e6a6fa785a243c0b410e43228445ec6bfb12af5f
          fi
      - name: Cache pinned Android Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Bound build memory and compile before booting emulator
        timeout-minutes: 10
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/gradle.properties')
          lines = [line for line in path.read_text().splitlines()
                   if not line.startswith(('org.gradle.jvmargs=', 'org.gradle.daemon=',
                                           'org.gradle.workers.max=', 'kotlin.compiler.execution.strategy='))]
          lines.extend(['org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError',
                        'org.gradle.daemon=false', 'org.gradle.workers.max=2',
                        'kotlin.compiler.execution.strategy=in-process'])
          path.write_text('\n'.join(lines) + '\n')
          PY
          free -m
          flutter build apk --debug --no-pub --target-platform=android-x64 --target=integration_test/app_navigation_test.dart --dart-define=LUDO_ENABLE_UNRELEASED_MODES=true
          test -s build/app/outputs/flutter-apk/app-debug.apk
          (cd android && ./gradlew --stop)
          free -m
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Prepare checkpoint launch script
        run: |
          cat > "$RUNNER_TEMP/ludo-android-checkpoint.sh" <<'BASH'
          set -euo pipefail
          if [ -n "$LUDO_COMPARISON_CASE" ]; then
            adb -s emulator-5554 shell wm size 360x800
            adb -s emulator-5554 shell wm density 160
            mkdir -p test-artifacts/gameplay
            {
              git rev-parse HEAD
              printf 'GitHub runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
              if [ -r "$ANDROID_HOME/emulator/source.properties" ]; then
                cat "$ANDROID_HOME/emulator/source.properties"
              fi
              adb version
              flutter --version
              sha256sum build/app/outputs/flutter-apk/app-debug.apk
              adb -s emulator-5554 shell getprop ro.build.fingerprint
            } > test-artifacts/gameplay/comparison-environment.txt 2>&1
          fi
          bash ../../.github/scripts/android_integration.sh
          BASH
          bash -n "$RUNNER_TEMP/ludo-android-checkpoint.sh"
      - name: Android emulator integration smoke test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 420
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          # Software OpenGL is the checkpoint configuration, not a physical GPU
          # acceptance result or a proven fix for historical emulator loss.
          disable-animations: true
          working-directory: apps/mobile
          script: bash "$RUNNER_TEMP/ludo-android-checkpoint.sh"
      - name: Upload installed Android emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-installed-android-emulator-screenshots${{ inputs.comparison-case && format('-{0}', inputs.comparison-case) || '' }}
          path: apps/mobile/test-artifacts/native/*.png
          if-no-files-found: error
      - name: Collect emulator diagnostics on failure
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          mkdir -p emulator-diagnostics
          free -m > emulator-diagnostics/host-memory.txt
          ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,40p' > emulator-diagnostics/host-processes.txt
          sudo dmesg -T | tail -200 > emulator-diagnostics/host-kernel.txt 2>&1 || true
          sudo python3 .github/scripts/summarize_emulator_crash.py > emulator-diagnostics/qemu-native-summary.txt
          if [ -d /tmp/android-runner ]; then
            find /tmp/android-runner -type f -name '*crash*' -printf '%f %s bytes\n' > emulator-diagnostics/native-crash-files.txt
          fi
          sudo chown -R "$(id -u):$(id -g)" emulator-diagnostics
          timeout 15s adb devices -l > emulator-diagnostics/devices.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 shell getprop > emulator-diagnostics/properties.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 logcat -d -t 3000 > emulator-diagnostics/logcat.txt 2>&1 || true
      - name: Upload emulator diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-emulator-diagnostics${{ inputs.comparison-case && format('-{0}', inputs.comparison-case) || '' }}
          path: emulator-diagnostics/
          if-no-files-found: warn
      - name: Upload live comparison logs
        if: always() && inputs.comparison-case != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-comparison-${{ inputs.comparison-case }}
          path: apps/mobile/test-artifacts/gameplay/
          if-no-files-found: warn
