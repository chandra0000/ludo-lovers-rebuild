name: Android integration (checkpoint)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-integration.yml"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: android-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-integration:
    # PRs are opt-in via label; main and manual dispatch always run.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-android-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Android emulator integration smoke test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 420
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile
          script: |
            set -euo pipefail
            adb devices -l
            adb shell getprop sys.boot_completed
            flutter test integration_test/app_navigation_test.dart --timeout 3m --reporter expanded -d emulator-5554
      - name: Collect emulator diagnostics on failure
        if: failure()
        run: |
          mkdir -p emulator-diagnostics
          adb devices -l > emulator-diagnostics/devices.txt 2>&1 || true
          adb shell getprop > emulator-diagnostics/properties.txt 2>&1 || true
          adb logcat -d -t 3000 > emulator-diagnostics/logcat.txt 2>&1 || true
      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ludo-lovers-emulator-diagnostics
          path: emulator-diagnostics/
          if-no-files-found: warn
