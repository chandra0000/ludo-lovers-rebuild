name: Android integration (checkpoint)

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  android-integration:
    # Run manually, or add the "run-android-integration" label to a PR.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-android-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .

      # Android emulator checks are intentionally opt-in. The runner action itself
      # waits for boot completion before executing its script. Avoid a second boot
      # attempt on slow software-emulated GitHub runners.
      - name: Android emulator integration smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: cd apps/mobile && flutter test integration_test/app_smoke_test.dart --timeout 2m --reporter expanded -d emulator-5554
