name: Android integration (checkpoint)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-integration.yml"
      - ".github/scripts/android_integration.sh"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: android-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-integration:
    # PRs are opt-in via label; main and manual dispatch always run.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-android-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate Android project files
        working-directory: apps/mobile
        run: flutter create --platforms=android --project-name=ludo_lovers --org=com.ludolovers .
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Android emulator integration smoke test
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 420
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/mobile
          script: bash ../../.github/scripts/android_integration.sh
      - name: Upload installed Android emulator screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-installed-android-emulator-screenshots
          path: apps/mobile/test-artifacts/native/*.png
          if-no-files-found: error
      - name: Collect emulator diagnostics on failure
        if: failure() || cancelled()
        timeout-minutes: 2
        run: |
          mkdir -p emulator-diagnostics
          timeout 15s adb devices -l > emulator-diagnostics/devices.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 shell getprop > emulator-diagnostics/properties.txt 2>&1 || true
          timeout 15s adb -s emulator-5554 logcat -d -t 3000 > emulator-diagnostics/logcat.txt 2>&1 || true
      - name: Upload emulator diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ludo-lovers-emulator-diagnostics
          path: emulator-diagnostics/
          if-no-files-found: warn
